opencollection: 1.0.0

info:
  name: Espresso API
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{apiKey}}"

docs:
  content: |-
    Espresso is a market and business intelligence API for searching concrete Events, interpreting Signals, and tracing evidence and Sources.
    **Events** are concrete developments. **Signals** are higher-level conclusions synthesized from supporting Events.
    **Collections** return `{data, pagination, meta}`. Pagination contains `limit`, `num_results`, and `next_cursor`. To continue, send `pagination.next_cursor` unchanged as `cursor`. Empty collections return HTTP 200 with `data: []`. Detail routes return `{data}`; missing detail resources return HTTP 404. Errors use `{ "error": { "code", "message" } }`. REST operations except health require `Authorization: Bearer <api_key>`.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
