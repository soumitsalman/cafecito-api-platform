info:
  name: Find Signals connected to an Event
  type: http
  seq: 4
  tags:
    - Events

http:
  method: GET
  url: "{{baseUrl}}/events/:event_id/signals"
  params:
    - name: event_id
      value: cd04fe3d-5732-563f-b7ca-d7f2ef4ce887
      type: path
      description: Event UUID (RFC 4122).
    - name: ids
      value: ""
      type: query
      description: Restrict returned Signals to Signal UUIDs (CSV).
      disabled: true
    - name: from
      value: ""
      type: query
      description: Inclusive Signal created_at lower bound (YYYY-MM-DD).
      disabled: true
    - name: to
      value: ""
      type: query
      description: Inclusive Signal created_at upper bound (YYYY-MM-DD).
      disabled: true
    - name: impact_levels
      value: ""
      type: query
      description: Exact impact-level names (CSV), for example high,medium.
      disabled: true
    - name: impacted_domains
      value: ""
      type: query
      description: Exact impacted-domain names in snake_case (CSV), for example public_health,climate.
      disabled: true
    - name: tags
      value: ""
      type: query
      description: Fuzzy text match against persisted Signal tag labels (CSV).
      disabled: true
    - name: response_type
      value: json
      type: query
      description: "Response serialization: JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients. JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients."
    - name: response_type
      value: yaml
      type: query
      description: "Response serialization: JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients. JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients."
      disabled: true
    - name: response_type
      value: toon
      type: query
      description: "Response serialization: JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients. JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients."
      disabled: true
    - name: limit
      value: "20"
      type: query
      description: Maximum records per page. Default 20, max 100.
    - name: cursor
      value: ""
      type: query
      description: Opaque continuation token. Send pagination.next_cursor from a previous response unchanged as cursor; never construct or decode it.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

