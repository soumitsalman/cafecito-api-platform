info:
  name: Find intelligence Sources
  type: http
  seq: 1
  tags:
    - Sources

http:
  method: GET
  url: "{{baseUrl}}/sources"
  params:
    - name: q
      value: ""
      type: query
      description: Case-insensitive Source metadata search.
      disabled: true
    - name: domains
      value: ""
      type: query
      description: Exact Source domain-name filter (CSV).
      disabled: true
    - name: limit
      value: "20"
      type: query
      description: Maximum records per page. Default 20, max 100.
    - name: cursor
      value: ""
      type: query
      description: Opaque continuation token. Send pagination.next_cursor from a previous response unchanged as cursor; never construct or decode it.
      disabled: true
    - name: response_type
      value: json
      type: query
      description: "Response serialization: JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients. JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients."
    - name: response_type
      value: yaml
      type: query
      description: "Response serialization: JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients. JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients."
      disabled: true
    - name: response_type
