info:
  name: Inspect evidence for an Event
  type: http
  seq: 3
  tags:
    - Events

http:
  method: GET
  url: "{{baseUrl}}/events/:event_id/evidence"
  params:
    - name: event_id
      value: ""
      type: path
      description: Event UUID (RFC 4122).
    - name: ids
      value: ""
      type: query
      description: Restrict returned evidence records to Event UUIDs (CSV).
      disabled: true
    - name: source_ids
      value: ""
      type: query
      description: Restrict direct evidence records to Source UUIDs (CSV).
      disabled: true
    - name: from
      value: ""
      type: query
      description: Inclusive evidence created_at lower bound (YYYY-MM-DD).
      disabled: true
    - name: to
      value: ""
      type: query
      description: Inclusive evidence created_at upper bound (YYYY-MM-DD).
      disabled: true
    - name: response_type
      value: json
      type: query
      description: "Response serialization: JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients. JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients."
    - name: response_type
      value: yaml
      type: query
      description: "Response serialization: JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients. JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients."
      disabled: true
    - name: response_type
      value: toon
      type: query
      description: "Response serialization: JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients. JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients."
      disabled: true
    - name: limit
      value: "20"
      type: query
      description: Maximum records per page. Default 20, max 100.
    - name: cursor
      value: ""
      type: query
      description: Opaque continuation token. Send pagination.next_cursor from a previous response unchanged as cursor; never construct or decode it.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

