info:
  name: Find synthesized Signals
  type: http
  seq: 1
  tags:
    - Signals

http:
  method: GET
  url: "{{baseUrl}}/signals"
  params:
    - name: q
      value: ""
      type: query
      description: Optional natural-language semantic query. Max 1024 characters.
      disabled: true
    - name: score_threshold
      value: "0.5"
      type: query
      description: Minimum semantic similarity threshold for q. 0.0 is broad and 1.0 is strict. Default 0.5.
    - name: from
      value: ""
      type: query
      description: Inclusive Signal created_at lower bound (YYYY-MM-DD).
      disabled: true
    - name: to
      value: ""
      type: query
      description: Inclusive Signal created_at upper bound (YYYY-MM-DD).
      disabled: true
    - name: ids
      value: ""
      type: query
      description: Restrict to Signal UUIDs (CSV).
      disabled: true
    - name: impact_levels
      value: ""
      type: query
      description: Exact impact-level names (CSV), for example high,medium.
      disabled: true
    - name: impacted_domains
      value: ""
      type: query
      description: Exact impacted-domain names in snake_case (CSV), for example public_health,climate.
      disabled: true
    - name: tags
      value: ""
      type: query
      description: Fuzzy text match against persisted Signal tag labels (CSV).
      disabled: true
    - name: response_type
      value: json
      type: query
      description: "Response serialization: JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients. JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients."
    - name: response_type
      value: yaml
      type: query
      description: "Response serialization: JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients. JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients."
      disabled: true
    - name: response_type
      value: toon
      type: query
      description: "Response serialization: JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients. JSON is canonical; YAML and TOON are token-optimized for MCP and AI-agent clients."
      disabled: true
    - name: limit
      value: "20"
      type: query
      description: Maximum records per page. Default 20, max 100.
    - name: cursor
      value: ""
      type: query
      description: Opaque continuation token. Send pagination.next_cursor from a previous response unchanged as cursor; never construct or decode it.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

