info:
  contact:
    email: soumitsrah@cafecito.tech
    name: Project Cafecito
    url: http://cafecito.tech
  description: |-
    MCP-ready business intelligence over curated intelligence records for agents, dashboards, and automated research workflows.
    An **Event** is a concrete intelligence record with kind `event`. A **Signal** is a synthesized conclusion derived from Events. The internal storage word `sip` is not part of the public vocabulary.
    Agent workflow: (1) listTags to discover filter vocabulary; (2) searchEvents for developments; (3) getEvent and getEventEvidence to trace source coverage; (4) searchSignals and getSignalEvents to trace synthesized conclusions.
    Conventions: Auth is optional at the backend but API-key protected through the gateway. Collections use page pagination: `limit` default 20 max 100, and an opaque `page` returned as `next_page`. Empty collections return HTTP 200 with `data: []`. Missing detail resources return 404. All IDs are RFC 4122 UUID strings.
    Response formats: use `response_type=json` for canonical structured application data. Use `response_type=yaml` or `response_type=toon` for token-optimized output to MCP and AI-agent clients. Public Event and Signal payloads expose flattened intelligence fields without embeddings, relation direction, or a nested internal object.
  license:
    name: MIT
  title: Espresso API & MCP
  version: "0.2"
paths:
  /entities:
    get:
      description: List exact company and people names available for Event filtering.
        Values are normalized snake_case filter names, not canonical entity IDs or
        profiles.
      operationId: listIntelligenceEntities
      parameters:
      - description: Case-insensitive substring filter.
        in: query
        maxLength: 1024
        name: q
        type: string
      - collectionFormat: csv
        description: 'Entity types (CSV): company, people.'
        in: query
        items:
          type: string
        name: types
        type: array
      - default: json
        description: Output serialization.
        enum:
        - json
        - yaml
        - toon
        in: query
        name: response_type
        type: string
      - default: 20
        description: Maximum records per page. Default 20, max 100.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque page token. Follow pagination.next_page for the next page.
        in: query
        name: page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Entity value collection envelope
          schema:
            $ref: '#/definitions/router.DiscoveryValueCollectionResponse'
        "400":
          description: Invalid limit, page token, or parameters
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Discover Event entities
      tags:
      - Discovery
  /event-types:
    get:
      description: List exact Event type names available for Event filtering. These
        values can be supplied to `event_types`; `categories` is a separate exact
        category filter.
      operationId: listIntelligenceEventTypes
      parameters:
      - description: Case-insensitive substring filter.
        in: query
        maxLength: 1024
        name: q
        type: string
      - default: json
        description: Output serialization.
        enum:
        - json
        - yaml
        - toon
        in: query
        name: response_type
        type: string
      - default: 20
        description: Maximum records per page. Default 20, max 100.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque page token. Follow pagination.next_page for the next page.
        in: query
        name: page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Event type value collection envelope
          schema:
            $ref: '#/definitions/router.DiscoveryValueCollectionResponse'
        "400":
          description: Invalid limit, page token, or parameters
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Discover Event types
      tags:
      - Discovery
  /events:
    get:
      description: |-
        Find Event records that match optional filters and an optional semantic query. Use this route to find concrete developments before following an Event's detail, evidence, or Signal links.
        **Time**: `from` and `to` are inclusive ISO date-only bounds on record `created_at`; they are not occurrence or publication timestamps.
        **Filters**: tags use fuzzy text matching. `event_types`, `categories`, `entities`, `impact_levels`, `companies`, `people`, `products`, and `regions` use exact matching after normalizing names to snake_case. `categories` is a separate category filter from `event_types`.
        **Output**: Event collections contain flattened intelligence fields plus `id`, `created_at`, and `kind`; provenance fields are available on the detail route when usable. YAML and TOON are token-optimized serializations for MCP and AI-agent clients.
      operationId: searchEvents
      parameters:
      - description: Optional natural-language semantic query. Max 1024 characters.
        in: query
        maxLength: 1024
        name: q
        type: string
      - description: Inclusive created_at lower bound (YYYY-MM-DD).
        format: date
        in: query
        name: from
        type: string
      - description: Inclusive created_at upper bound (YYYY-MM-DD).
        format: date
        in: query
        name: to
        type: string
      - collectionFormat: csv
        description: Restrict to Event UUIDs (CSV).
        in: query
        items:
          type: string
        name: ids
        type: array
      - collectionFormat: csv
        description: Exact Event type names in snake_case (CSV), for example policy_change,market_entry.
        in: query
        items:
          type: string
        name: event_types
        type: array
      - collectionFormat: csv
        description: Exact category names in snake_case (CSV), for example regulation,technology.
          This is separate from event_types.
        in: query
        items:
          type: string
        name: categories
        type: array
      - collectionFormat: csv
        description: Exact entity names in snake_case, matched against company or
          people names (CSV), for example microsoft,nvidia.
        in: query
        items:
          type: string
        name: entities
        type: array
      - collectionFormat: csv
        description: Exact impact-level names (CSV), for example high,medium.
        in: query
        items:
          type: string
        name: impact_levels
        type: array
      - collectionFormat: csv
        description: Exact company names in snake_case (CSV), for example microsoft,nvidia.
        in: query
        items:
          type: string
        name: companies
        type: array
      - collectionFormat: csv
        description: Exact person names in snake_case (CSV), for example sam_altman,elon_musk.
        in: query
        items:
          type: string
        name: people
        type: array
      - collectionFormat: csv
        description: Exact product names in snake_case (CSV), for example windows,geforce.
        in: query
        items:
          type: string
        name: products
        type: array
      - collectionFormat: csv
        description: Exact region names in snake_case (CSV), for example north_america,europe.
        in: query
        items:
          type: string
        name: regions
        type: array
      - collectionFormat: csv
        description: Restrict to direct Event source UUIDs (CSV).
        in: query
        items:
          type: string
        name: source_ids
        type: array
      - collectionFormat: csv
        description: Fuzzy text match against persisted tag labels (CSV).
        in: query
        items:
          type: string
        name: tags
        type: array
      - default: json
        description: Output serialization. JSON is canonical; YAML and TOON are token-optimized
          for MCP and AI-agent clients.
        enum:
        - json
        - yaml
        - toon
        in: query
        name: response_type
        type: string
      - default: 20
        description: Maximum records per page. Default 20, max 100.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque page token. Follow pagination.next_page for the next page.
        in: query
        name: page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Event collection envelope
          schema:
            $ref: '#/definitions/router.EventCollectionResponse'
        "400":
          description: Invalid query parameters, malformed UUID, or malformed page
            token
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Concurrency limit exceeded; retry shortly
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database or embedder unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Search Events
      tags:
      - Events
  /events/{event_id}:
    get:
      description: Retrieve an Event by UUID. The detail payload contains flattened
        intelligence fields and detail-only provenance, optional Source metadata,
        relation links, and relation counts. `created_at` is the record creation time,
        not an Event occurrence date.
      operationId: getEvent
      parameters:
      - description: Event UUID (RFC 4122).
        format: uuid
        in: path
        name: event_id
        required: true
        type: string
      - default: json
        description: Output serialization. JSON is canonical; YAML and TOON are token-optimized
          for MCP and AI-agent clients.
        enum:
        - json
        - yaml
        - toon
        in: query
        name: response_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Event detail envelope
          schema:
            $ref: '#/definitions/router.EventDetailResponse'
        "400":
          description: Malformed UUID
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No Event with this UUID
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Concurrency limit exceeded; retry shortly
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Retrieve one Event
      tags:
      - Events
  /events/{event_id}/evidence:
    get:
      description: Show the directly related records that make up an Event's evidence
        trail, helping clients assess source coverage. It is not article content or
        story membership. The item projection exposes record identity, creation time,
        tags, source ID, and available URLs.
      operationId: getEventEvidence
      parameters:
      - description: Event UUID (RFC 4122).
        format: uuid
        in: path
        name: event_id
        required: true
        type: string
      - collectionFormat: csv
        description: Restrict returned evidence records to Event UUIDs (CSV).
        in: query
        items:
          type: string
        name: ids
        type: array
      - collectionFormat: csv
        description: Restrict direct evidence records to Source UUIDs (CSV).
        in: query
        items:
          type: string
        name: source_ids
        type: array
      - description: Inclusive evidence created_at lower bound (YYYY-MM-DD).
        format: date
        in: query
        name: from
        type: string
      - description: Inclusive evidence created_at upper bound (YYYY-MM-DD).
        format: date
        in: query
        name: to
        type: string
      - default: json
        description: Output serialization. JSON is canonical; YAML and TOON are token-optimized
          for MCP and AI-agent clients.
        enum:
        - json
        - yaml
        - toon
        in: query
        name: response_type
        type: string
      - default: 20
        description: Maximum records per page. Default 20, max 100.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque page token. Follow pagination.next_page for the next page.
        in: query
        name: page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Event evidence collection envelope
          schema:
            $ref: '#/definitions/router.EventEvidenceCollectionResponse'
        "400":
          description: Malformed UUID or invalid parameters
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No Event with this UUID
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Concurrency limit exceeded; retry shortly
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Retrieve an Event evidence trail
      tags:
      - Events
  /events/{event_id}/signals:
    get:
      description: Return the higher-level Signals that were derived from the Event's
        evidence trail. Use this relation route after retrieving an Event to inspect
        synthesized conclusions; an existing Event with no matching Signals returns
        an empty collection.
      operationId: getEventSignals
      parameters:
      - description: Event UUID (RFC 4122).
        format: uuid
        in: path
        name: event_id
        required: true
        type: string
      - collectionFormat: csv
        description: Restrict returned Signals to Signal UUIDs (CSV).
        in: query
        items:
          type: string
        name: ids
        type: array
      - description: Inclusive Signal created_at lower bound (YYYY-MM-DD).
        format: date
        in: query
        name: from
        type: string
      - description: Inclusive Signal created_at upper bound (YYYY-MM-DD).
        format: date
        in: query
        name: to
        type: string
      - collectionFormat: csv
        description: Exact impact-level names (CSV), for example high,medium.
        in: query
        items:
          type: string
        name: impact_levels
        type: array
      - collectionFormat: csv
        description: Exact impacted-domain names in snake_case (CSV), for example
          public_health,climate.
        in: query
        items:
          type: string
        name: impacted_domains
        type: array
      - collectionFormat: csv
        description: Fuzzy text match against persisted Signal tag labels (CSV).
        in: query
        items:
          type: string
        name: tags
        type: array
      - default: json
        description: Output serialization. JSON is canonical; YAML and TOON are token-optimized
          for MCP and AI-agent clients.
        enum:
        - json
        - yaml
        - toon
        in: query
        name: response_type
        type: string
      - default: 20
        description: Maximum records per page. Default 20, max 100.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque page token. Follow pagination.next_page for the next page.
        in: query
        name: page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Signals derived from this Event
          schema:
            $ref: '#/definitions/router.SignalCollectionResponse'
        "400":
          description: Malformed UUID, invalid page token, or invalid parameters
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No Event with this UUID
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Concurrency limit exceeded; retry shortly
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database or embedder unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Retrieve Signals derived from an Event
      tags:
      - Events
  /health:
    get:
      description: Lightweight liveness probe. Use it before other tools to confirm
        the Espresso backend is reachable. This endpoint does not require query parameters
        and returns only service status.
      operationId: healthCheck
      produces:
      - application/json
      responses:
        "200":
          description: Service is alive
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check API health
      tags:
      - Health
  /regions:
    get:
      description: List exact region names available for Event filtering. Values are
        normalized snake_case names, not structured geography or canonical place records.
      operationId: listIntelligenceRegions
      parameters:
      - description: Case-insensitive substring filter.
        in: query
        maxLength: 1024
        name: q
        type: string
      - default: json
        description: Output serialization.
        enum:
        - json
        - yaml
        - toon
        in: query
        name: response_type
        type: string
      - default: 20
        description: Maximum records per page. Default 20, max 100.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque page token. Follow pagination.next_page for the next page.
        in: query
        name: page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Region value collection envelope
          schema:
            $ref: '#/definitions/router.DiscoveryValueCollectionResponse'
        "400":
          description: Invalid limit, page token, or parameters
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Discover Event regions
      tags:
      - Discovery
  /signals:
    get:
      description: |-
        Find synthesized Signal records with optional filters and an optional semantic query. Use this route for higher-level conclusions, then follow a Signal detail or supporting-Events link to inspect its basis.
        **Time**: `from` and `to` are inclusive ISO date-only bounds on Signal `created_at`.
        **Filters**: tags use fuzzy text matching. Impact levels and impacted domains use exact snake_case matching. Collection items omit provenance fields; use Signal detail when Source metadata is usable.
      operationId: searchSignals
      parameters:
      - description: Optional natural-language semantic query. Max 1024 characters.
        in: query
        maxLength: 1024
        name: q
        type: string
      - description: Inclusive Signal created_at lower bound (YYYY-MM-DD).
        format: date
        in: query
        name: from
        type: string
      - description: Inclusive Signal created_at upper bound (YYYY-MM-DD).
        format: date
        in: query
        name: to
        type: string
      - collectionFormat: csv
        description: Restrict to Signal UUIDs (CSV).
        in: query
        items:
          type: string
        name: ids
        type: array
      - collectionFormat: csv
        description: Exact impact-level names (CSV), for example high,medium.
        in: query
        items:
          type: string
        name: impact_levels
        type: array
      - collectionFormat: csv
        description: Exact impacted-domain names in snake_case (CSV), for example
          public_health,climate.
        in: query
        items:
          type: string
        name: impacted_domains
        type: array
      - collectionFormat: csv
        description: Fuzzy text match against persisted Signal tag labels (CSV).
        in: query
        items:
          type: string
        name: tags
        type: array
      - default: json
        description: Output serialization. JSON is canonical; YAML and TOON are token-optimized
          for MCP and AI-agent clients.
        enum:
        - json
        - yaml
        - toon
        in: query
        name: response_type
        type: string
      - default: 20
        description: Maximum records per page. Default 20, max 100.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque page token. Follow pagination.next_page for the next page.
        in: query
        name: page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Signal collection envelope
          schema:
            $ref: '#/definitions/router.SignalCollectionResponse'
        "400":
          description: Invalid query parameters, malformed UUID, or malformed page
            token
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Concurrency limit exceeded; retry shortly
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database or embedder unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Search Signals
      tags:
      - Signals
  /signals/{signal_id}:
    get:
      description: Retrieve a Signal by UUID. The detail payload contains flattened
        intelligence fields, optional provenance when a usable Source exists, and
        links/counts for supporting Events. `created_at` is the Signal record creation
        time.
      operationId: getSignal
      parameters:
      - description: Signal UUID (RFC 4122).
        format: uuid
        in: path
        name: signal_id
        required: true
        type: string
      - default: json
        description: Output serialization. JSON is canonical; YAML and TOON are token-optimized
          for MCP and AI-agent clients.
        enum:
        - json
        - yaml
        - toon
        in: query
        name: response_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Signal detail envelope
          schema:
            $ref: '#/definitions/router.SignalDetailResponse'
        "400":
          description: Malformed UUID
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No Signal with this UUID
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Concurrency limit exceeded; retry shortly
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Retrieve one Signal
      tags:
      - Signals
  /signals/{signal_id}/events:
    get:
      description: Return the Events that were used to derive the Signal, so clients
        can inspect the basis of its conclusion. An existing Signal with no matching
        Events returns an empty collection.
      operationId: getSignalEvents
      parameters:
      - description: Signal UUID (RFC 4122).
        format: uuid
        in: path
        name: signal_id
        required: true
        type: string
      - collectionFormat: csv
        description: Restrict returned Events to Event UUIDs (CSV).
        in: query
        items:
          type: string
        name: ids
        type: array
      - collectionFormat: csv
        description: Exact Event type names in snake_case (CSV), for example policy_change,market_entry.
        in: query
        items:
          type: string
        name: event_types
        type: array
      - collectionFormat: csv
        description: Exact category names in snake_case (CSV), for example regulation,technology.
          This is separate from event_types.
        in: query
        items:
          type: string
        name: categories
        type: array
      - collectionFormat: csv
        description: Exact entity names in snake_case, matched against company or
          people names (CSV), for example microsoft,nvidia.
        in: query
        items:
          type: string
        name: entities
        type: array
      - collectionFormat: csv
        description: Exact impact-level names (CSV), for example high,medium.
        in: query
        items:
          type: string
        name: impact_levels
        type: array
      - collectionFormat: csv
        description: Exact company names in snake_case (CSV), for example microsoft,nvidia.
        in: query
        items:
          type: string
        name: companies
        type: array
      - collectionFormat: csv
        description: Exact person names in snake_case (CSV), for example sam_altman,elon_musk.
        in: query
        items:
          type: string
        name: people
        type: array
      - collectionFormat: csv
        description: Exact product names in snake_case (CSV), for example windows,geforce.
        in: query
        items:
          type: string
        name: products
        type: array
      - collectionFormat: csv
        description: Exact region names in snake_case (CSV), for example north_america,europe.
        in: query
        items:
          type: string
        name: regions
        type: array
      - collectionFormat: csv
        description: Restrict returned Events to Source UUIDs (CSV).
        in: query
        items:
          type: string
        name: source_ids
        type: array
      - collectionFormat: csv
        description: Fuzzy text match against persisted Event tag labels (CSV).
        in: query
        items:
          type: string
        name: tags
        type: array
      - description: Inclusive Event created_at lower bound (YYYY-MM-DD).
        format: date
        in: query
        name: from
        type: string
      - description: Inclusive Event created_at upper bound (YYYY-MM-DD).
        format: date
        in: query
        name: to
        type: string
      - default: json
        description: Output serialization. JSON is canonical; YAML and TOON are token-optimized
          for MCP and AI-agent clients.
        enum:
        - json
        - yaml
        - toon
        in: query
        name: response_type
        type: string
      - default: 20
        description: Maximum records per page. Default 20, max 100.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque page token. Follow pagination.next_page for the next page.
        in: query
        name: page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Events supporting this Signal
          schema:
            $ref: '#/definitions/router.EventCollectionResponse'
        "400":
          description: Malformed UUID, invalid page token, or invalid parameters
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No Signal with this UUID
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Concurrency limit exceeded; retry shortly
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database or embedder unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Retrieve Events supporting a Signal
      tags:
      - Signals
