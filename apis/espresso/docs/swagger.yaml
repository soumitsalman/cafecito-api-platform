      - description: Signal UUID (RFC 4122).
        format: uuid
        in: path
        name: signal_id
        required: true
        type: string
      - collectionFormat: csv
        description: Restrict returned Events to Event UUIDs (CSV).
        in: query
        items:
          type: string
        name: ids
        type: array
      - collectionFormat: csv
        description: Exact Event type names in snake_case (CSV), for example policy_change,market_entry.
        in: query
        items:
          type: string
        name: event_types
        type: array
      - collectionFormat: csv
        description: Exact category names in snake_case (CSV), for example regulation,technology.
          This is separate from event_types.
        in: query
        items:
          type: string
        name: categories
        type: array
      - collectionFormat: csv
        description: Exact entity names in snake_case, matched against company or
          people names (CSV), for example microsoft,nvidia.
        in: query
        items:
          type: string
        name: entities
        type: array
      - collectionFormat: csv
        description: Exact impact-level names (CSV), for example high,medium.
        in: query
        items:
          type: string
        name: impact_levels
        type: array
      - collectionFormat: csv
        description: Exact company names in snake_case (CSV), for example microsoft,nvidia.
        in: query
        items:
          type: string
        name: companies
        type: array
      - collectionFormat: csv
        description: Exact person names in snake_case (CSV), for example sam_altman,elon_musk.
        in: query
        items:
          type: string
        name: people
        type: array
      - collectionFormat: csv
        description: Exact product names in snake_case (CSV), for example windows,geforce.
        in: query
        items:
          type: string
        name: products
        type: array
      - collectionFormat: csv
        description: Exact region names in snake_case (CSV), for example north_america,europe.
        in: query
        items:
          type: string
        name: regions
        type: array
      - collectionFormat: csv
        description: Restrict returned Events to Source UUIDs (CSV).
        in: query
        items:
          type: string
        name: source_ids
        type: array
      - collectionFormat: csv
        description: Fuzzy text match against persisted Event tag labels (CSV).
        in: query
        items:
          type: string
        name: tags
        type: array
      - description: Inclusive Event created_at lower bound (YYYY-MM-DD).
        format: date
        in: query
        name: from
        type: string
      - description: Inclusive Event created_at upper bound (YYYY-MM-DD).
        format: date
        in: query
        name: to
        type: string
      - default: json
        description: 'Response serialization: JSON is canonical; YAML and TOON are
          token-optimized for MCP and AI-agent clients. JSON is canonical; YAML and
          TOON are token-optimized for MCP and AI-agent clients.'
