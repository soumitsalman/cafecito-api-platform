info:
  contact:
    email: soumitsrah@cafecito.tech
    name: Project Cafecito
    url: http://cafecito.tech
  description: |-
    Espresso provides read-only business intelligence for AI agents, automated research, and analytical applications.
    **Events** are concrete developments involving an organization, person, product, market, or region. **Signals** are higher-level conclusions synthesized from supporting Events.
    **Choose a route by user intent**: What happened? Search Events. What does it mean or what is the outlook? Search Signals. What supports a conclusion? Retrieve a Signal, then list its supporting Events. What evidence or source coverage exists? Retrieve an Event, then inspect its evidence. Which exact filter value should I use? Use a discovery route only when the value is not already known.
    **Recommended agent workflow**: (1) search the appropriate collection with the smallest useful filter set; (2) select IDs from `data`; (3) retrieve detail only for selected IDs; (4) traverse evidence, related Signals, or supporting Events only when explanation, provenance, or context is needed.
    **Collections** return `{data, pagination, meta}`. `pagination.num_results` is the count in the current page, not a total-match count. To continue, send `pagination.next_cursor` unchanged as the next request `cursor`; never construct or decode cursor tokens. Empty collections return HTTP 200 with `data: []`. Detail routes return `{data}`; missing detail resources return HTTP 404.
    **Filtering**: `tags` use fuzzy text matching. `event_types`, `categories`, `entities`, `impact_levels`, `companies`, `people`, `products`, and `regions` use exact matching after snake_case normalization. `categories` and `event_types` are separate fields. `from` and `to` bound record `created_at`, not occurrence, publication, lifecycle, or forecast time.
    **Formats**: JSON is canonical. YAML and TOON represent the same public payload in token-optimized forms for MCP and AI-agent context. Public payloads never expose embeddings, relation direction, or internal storage objects.
  license:
    name: MIT
  title: Espresso API & MCP
  version: "0.2"
paths:
  /entities:
    get:
      description: |-
        Use only when an agent needs available company or people names before applying an exact Event filter. Returned values are normalized snake_case filter strings, not canonical entity IDs or profiles.
        If a known normalized value is already available, query Events directly. Use `types=company` or `types=people` to reduce the returned vocabulary.
      operationId: listIntelligenceEntities
      parameters:
      - description: Case-insensitive substring filter.
        in: query
        maxLength: 1024
        name: q
        type: string
      - collectionFormat: csv
        description: 'Entity types (CSV): company, people.'
        in: query
        items:
          type: string
        name: types
        type: array
      - default: json
        description: 'Response serialization: JSON is canonical; YAML and TOON are
          token-optimized for MCP and AI-agent clients.'
        enum:
        - json
        - yaml
        - toon
        in: query
        name: response_type
        type: string
      - default: 20
        description: Maximum records per page. Default 20, max 100.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque continuation token. Send pagination.next_cursor from a
          previous response unchanged as cursor; never construct or decode it.
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Entity value collection envelope
          schema:
            $ref: '#/definitions/router.DiscoveryValueCollectionResponse'
        "400":
          description: Invalid limit, cursor token, or parameters
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Discover exact Event entity filters
      tags:
      - Discovery
  /event-types:
    get:
      description: |-
        Use only when an agent needs available values before applying the exact `event_types` Event filter. Returned values are normalized snake_case filter strings.
        `event_types` and `categories` filter different Event fields. If a known normalized value is already available, query Events directly.
      operationId: listIntelligenceEventTypes
      parameters:
      - description: Case-insensitive substring filter.
        in: query
        maxLength: 1024
        name: q
        type: string
      - default: json
        description: 'Response serialization: JSON is canonical; YAML and TOON are
          token-optimized for MCP and AI-agent clients.'
        enum:
        - json
        - yaml
        - toon
        in: query
        name: response_type
        type: string
      - default: 20
        description: Maximum records per page. Default 20, max 100.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque continuation token. Send pagination.next_cursor from a
          previous response unchanged as cursor; never construct or decode it.
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Event type value collection envelope
          schema:
            $ref: '#/definitions/router.DiscoveryValueCollectionResponse'
        "400":
          description: Invalid limit, cursor token, or parameters
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Discover exact Event type filters
      tags:
      - Discovery
  /events:
    get:
      description: |-
        Use when the user asks what happened to a company, person, product, region, or topic. Returns concrete Event records, not article bodies and not synthesized conclusions.
        Carry a selected `data[].id` into Event detail, evidence, or related-Signals routes. Use `tags` for fuzzy concepts; use structured filters for exact normalized values. `categories` is not an alias for `event_types`.
        Search Signals instead when the user asks for meaning, implication, or outlook. `from` and `to` bound record `created_at`, not occurrence or publication time.
      operationId: searchEvents
      parameters:
      - description: Optional natural-language semantic query. Max 1024 characters.
        in: query
        maxLength: 1024
        name: q
        type: string
      - default: 0.5
        description: Minimum semantic similarity threshold for q. 0.0 is broad and
          1.0 is strict. Default 0.5.
        in: query
        maximum: 1
        minimum: 0
        name: score_threshold
        type: number
      - description: Inclusive created_at lower bound (YYYY-MM-DD).
        format: date
        in: query
        name: from
        type: string
      - description: Inclusive created_at upper bound (YYYY-MM-DD).
        format: date
        in: query
        name: to
        type: string
      - collectionFormat: csv
        description: Restrict to Event UUIDs (CSV).
        in: query
        items:
          type: string
        name: ids
        type: array
      - collectionFormat: csv
        description: Exact Event type names in snake_case (CSV), for example policy_change,market_entry.
        in: query
        items:
          type: string
        name: event_types
        type: array
      - collectionFormat: csv
        description: Exact category names in snake_case (CSV), for example regulation,technology.
          This is separate from event_types.
        in: query
        items:
          type: string
        name: categories
        type: array
      - collectionFormat: csv
        description: Exact entity names in snake_case, matched against company or
          people names (CSV), for example microsoft,nvidia.
        in: query
        items:
          type: string
        name: entities
        type: array
      - collectionFormat: csv
        description: Exact impact-level names (CSV), for example high,medium.
        in: query
        items:
          type: string
        name: impact_levels
        type: array
      - collectionFormat: csv
        description: Exact company names in snake_case (CSV), for example microsoft,nvidia.
        in: query
        items:
          type: string
        name: companies
        type: array
      - collectionFormat: csv
        description: Exact person names in snake_case (CSV), for example sam_altman,elon_musk.
        in: query
        items:
          type: string
        name: people
        type: array
      - collectionFormat: csv
        description: Exact product names in snake_case (CSV), for example windows,geforce.
        in: query
        items:
          type: string
        name: products
        type: array
      - collectionFormat: csv
        description: Exact region names in snake_case (CSV), for example north_america,europe.
        in: query
        items:
          type: string
        name: regions
        type: array
      - collectionFormat: csv
        description: Restrict to direct Event source UUIDs (CSV).
        in: query
        items:
          type: string
        name: source_ids
        type: array
      - collectionFormat: csv
        description: Fuzzy text match against persisted tag labels (CSV).
        in: query
        items:
          type: string
        name: tags
        type: array
      - default: json
        description: 'Response serialization: JSON is canonical; YAML and TOON are
          token-optimized for MCP and AI-agent clients. JSON is canonical; YAML and
          TOON are token-optimized for MCP and AI-agent clients.'
        enum:
        - json
        - yaml
        - toon
        in: query
        name: response_type
        type: string
      - default: 20
        description: Maximum records per page. Default 20, max 100.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque continuation token. Send pagination.next_cursor from a
          previous response unchanged as cursor; never construct or decode it.
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Event collection envelope
          schema:
            $ref: '#/definitions/router.EventCollectionResponse'
        "400":
          description: Invalid query parameters, malformed UUID, or malformed cursor
            token
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Concurrency limit exceeded; retry shortly
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database or embedder unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Find concrete Events
      tags:
      - Events
  /events/{event_id}:
    get:
      description: |-
        Use after selecting an Event from a collection. Returns its complete public view, optional Source provenance, and links/counts for available evidence and related Signals.
        Carry the Event ID to `/events/{event_id}/evidence` for supporting context or source coverage, or to `/events/{event_id}/signals` for associated higher-level conclusions. `created_at` is record creation time, not Event occurrence time.
      operationId: getEvent
      parameters:
      - description: Event UUID (RFC 4122).
        format: uuid
        in: path
        name: event_id
        required: true
        type: string
      - default: json
        description: 'Response serialization: JSON is canonical; YAML and TOON are
          token-optimized for MCP and AI-agent clients. JSON is canonical; YAML and
          TOON are token-optimized for MCP and AI-agent clients.'
        enum:
        - json
        - yaml
        - toon
        in: query
        name: response_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Event detail envelope
          schema:
            $ref: '#/definitions/router.EventDetailResponse'
        "400":
          description: Malformed UUID
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No Event with this UUID
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Concurrency limit exceeded; retry shortly
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Inspect one Event
      tags:
      - Events
  /events/{event_id}/evidence:
    get:
      description: |-
        Use after selecting an Event when the user needs supporting context, available source coverage, or traceability. Returns directly related evidence records with identity, creation time, tags, Source IDs, and available URLs.
        This is not an article-body endpoint, a story-clustering endpoint, or a complete record-history export. An empty collection means no evidence records are available for this Event under the supplied filters.
      operationId: getEventEvidence
      parameters:
      - description: Event UUID (RFC 4122).
        format: uuid
        in: path
        name: event_id
        required: true
        type: string
      - collectionFormat: csv
        description: Restrict returned evidence records to Event UUIDs (CSV).
        in: query
        items:
          type: string
        name: ids
        type: array
      - collectionFormat: csv
        description: Restrict direct evidence records to Source UUIDs (CSV).
        in: query
        items:
          type: string
        name: source_ids
        type: array
      - description: Inclusive evidence created_at lower bound (YYYY-MM-DD).
        format: date
        in: query
        name: from
        type: string
      - description: Inclusive evidence created_at upper bound (YYYY-MM-DD).
        format: date
        in: query
        name: to
        type: string
      - default: json
        description: 'Response serialization: JSON is canonical; YAML and TOON are
          token-optimized for MCP and AI-agent clients. JSON is canonical; YAML and
          TOON are token-optimized for MCP and AI-agent clients.'
        enum:
        - json
        - yaml
        - toon
        in: query
        name: response_type
        type: string
      - default: 20
        description: Maximum records per page. Default 20, max 100.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque continuation token. Send pagination.next_cursor from a
          previous response unchanged as cursor; never construct or decode it.
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Event evidence collection envelope
          schema:
            $ref: '#/definitions/router.EventEvidenceCollectionResponse'
        "400":
          description: Malformed UUID or invalid parameters
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No Event with this UUID
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Concurrency limit exceeded; retry shortly
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Inspect evidence for an Event
      tags:
      - Events
  /events/{event_id}/signals:
    get:
      description: |-
        Use after selecting an Event to find higher-level conclusions associated with that development. Returns Signal records that can be inspected individually or followed to their supporting Events.
        An empty collection means Espresso has no available Signal connected to this Event; it does not invalidate the Event. This route narrows associated Signals; use `/signals` for a new Signal search.
      operationId: getEventSignals
      parameters:
      - description: Event UUID (RFC 4122).
        format: uuid
        in: path
        name: event_id
        required: true
        type: string
      - collectionFormat: csv
        description: Restrict returned Signals to Signal UUIDs (CSV).
        in: query
        items:
          type: string
        name: ids
        type: array
      - description: Inclusive Signal created_at lower bound (YYYY-MM-DD).
        format: date
        in: query
        name: from
        type: string
      - description: Inclusive Signal created_at upper bound (YYYY-MM-DD).
        format: date
        in: query
        name: to
        type: string
      - collectionFormat: csv
        description: Exact impact-level names (CSV), for example high,medium.
        in: query
        items:
          type: string
        name: impact_levels
        type: array
      - collectionFormat: csv
        description: Exact impacted-domain names in snake_case (CSV), for example
          public_health,climate.
        in: query
        items:
          type: string
        name: impacted_domains
        type: array
      - collectionFormat: csv
        description: Fuzzy text match against persisted Signal tag labels (CSV).
        in: query
        items:
          type: string
        name: tags
        type: array
      - default: json
        description: 'Response serialization: JSON is canonical; YAML and TOON are
          token-optimized for MCP and AI-agent clients. JSON is canonical; YAML and
          TOON are token-optimized for MCP and AI-agent clients.'
        enum:
        - json
        - yaml
        - toon
        in: query
        name: response_type
        type: string
      - default: 20
        description: Maximum records per page. Default 20, max 100.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque continuation token. Send pagination.next_cursor from a
          previous response unchanged as cursor; never construct or decode it.
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Signals derived from this Event
          schema:
            $ref: '#/definitions/router.SignalCollectionResponse'
        "400":
          description: Malformed UUID, invalid cursor token, or invalid parameters
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No Event with this UUID
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Concurrency limit exceeded; retry shortly
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database or embedder unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Find Signals connected to an Event
      tags:
      - Events
  /health:
    get:
      description: Use this lightweight endpoint to confirm that the Espresso service
        is reachable before making intelligence requests. It returns service status
        only; it does not validate an API key, search data, or report dependency health.
      operationId: healthCheck
      produces:
      - application/json
      responses:
        "200":
          description: Service is alive
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check Espresso service availability
      tags:
      - Health
  /regions:
    get:
      description: |-
        Use only when an agent needs available region values before applying the exact `regions` Event filter. Returned values are normalized snake_case filter strings, not canonical places, coordinates, or structured geography.
        If a known normalized value is already available, query Events directly.
      operationId: listIntelligenceRegions
      parameters:
      - description: Case-insensitive substring filter.
        in: query
        maxLength: 1024
        name: q
        type: string
      - default: json
        description: 'Response serialization: JSON is canonical; YAML and TOON are
          token-optimized for MCP and AI-agent clients.'
        enum:
        - json
        - yaml
        - toon
        in: query
        name: response_type
        type: string
      - default: 20
        description: Maximum records per page. Default 20, max 100.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque continuation token. Send pagination.next_cursor from a
          previous response unchanged as cursor; never construct or decode it.
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Region value collection envelope
          schema:
            $ref: '#/definitions/router.DiscoveryValueCollectionResponse'
        "400":
          description: Invalid limit, cursor token, or parameters
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Discover exact Event region filters
      tags:
      - Discovery
  /signals:
    get:
      description: |-
        Use when the user asks what a set of developments means, what impact is expected, or what broader conclusion Espresso has produced. Returns synthesized Signals, not raw observations or article content.
        Carry a selected `data[].id` into Signal detail, then list supporting Events when the conclusion needs substantiation. Search Events instead when the user needs a concrete development rather than an interpretation.
        `from` and `to` bound Signal `created_at`; tags are fuzzy text matches, while impact levels and impacted domains are exact normalized values.
      operationId: searchSignals
      parameters:
      - description: Optional natural-language semantic query. Max 1024 characters.
        in: query
        maxLength: 1024
        name: q
        type: string
      - default: 0.5
        description: Minimum semantic similarity threshold for q. 0.0 is broad and
          1.0 is strict. Default 0.5.
        in: query
        maximum: 1
        minimum: 0
        name: score_threshold
        type: number
      - description: Inclusive Signal created_at lower bound (YYYY-MM-DD).
        format: date
        in: query
        name: from
        type: string
      - description: Inclusive Signal created_at upper bound (YYYY-MM-DD).
        format: date
        in: query
        name: to
        type: string
      - collectionFormat: csv
        description: Restrict to Signal UUIDs (CSV).
        in: query
        items:
          type: string
        name: ids
        type: array
      - collectionFormat: csv
        description: Exact impact-level names (CSV), for example high,medium.
        in: query
        items:
          type: string
        name: impact_levels
        type: array
      - collectionFormat: csv
        description: Exact impacted-domain names in snake_case (CSV), for example
          public_health,climate.
        in: query
        items:
          type: string
        name: impacted_domains
        type: array
      - collectionFormat: csv
        description: Fuzzy text match against persisted Signal tag labels (CSV).
        in: query
        items:
          type: string
        name: tags
        type: array
      - default: json
        description: 'Response serialization: JSON is canonical; YAML and TOON are
          token-optimized for MCP and AI-agent clients. JSON is canonical; YAML and
          TOON are token-optimized for MCP and AI-agent clients.'
        enum:
        - json
        - yaml
        - toon
        in: query
        name: response_type
        type: string
      - default: 20
        description: Maximum records per page. Default 20, max 100.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque continuation token. Send pagination.next_cursor from a
          previous response unchanged as cursor; never construct or decode it.
