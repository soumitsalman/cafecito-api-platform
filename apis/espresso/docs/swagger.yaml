info:
  contact:
    email: soumitsrah@cafecito.tech
    name: Project Cafecito
    url: http://cafecito.tech
  description: |-
    MCP-ready business intelligence over curated intelligence records for agents, dashboards, and automated research workflows.
    An **Event** is any record whose kind starts with `event` (canonical `event`, plus `event:news`, `event:blog`, `event:post`, `event:site`, `event:social`). A **Signal** is a synthesized conclusion derived from Events. The internal storage word `sip` is not part of the public vocabulary.
    Agent workflow: (1) listTags to discover filter vocabulary; (2) searchEvents for developments; (3) getEvent and getEventEvidence to trace source coverage; (4) searchSignals and getSignalEvents to trace synthesized conclusions.
    Conventions: Auth is optional at the backend but API-key protected through the gateway. Collections use cursor pagination: `limit` default 20 max 128, and an opaque `cursor` returned as `next_cursor`. Empty collections return HTTP 200 with `data: []`. Missing detail resources return 404. All IDs are RFC 4122 UUID strings.
    Response formats: use `response_type=json` for structured application data. Use `response_type=text` for MCP/LLM context; it returns the same non-empty digest members as compact field-per-line plain text with `---` record delimiters. Public Event and Signal payloads do not synthesize storage id, created, kind, representation, or object fields.
  license:
    name: MIT
  title: Espresso API & MCP
  version: "0.2"
paths:
  /events:
    get:
      description: |-
        Which Event-family records match my question and filters? Returns every record where kind LIKE event% (canonical event plus event:news, event:blog, event:post, event:site, event:social). Each public item is the raw non-empty flattened digest object; storage fields such as id, created, kind, representation, and object are not synthesized.
        **When to use**: retrieve concrete developments, incidents, company actions, policy changes, or market moves before moving to higher-level signals.
        **Search modes**: `q` + `acc` for semantic search (default sort becomes `relevance`); without `q` records are sorted by `created_at` descending (`recent`).
        **Time**: `from`/`to` are inclusive bounds on record `created_at` until an occurrence-time field exists. They do not claim Event occurrence time.
        **Tags**: match on persisted tags uses overlap (any supplied tag).
        **Response shape**: raw non-empty flattened digest members. Use the detail route for follow-up links and relation counts.
        **Agent format**: use `response_type=text` for compact field-per-line records with `---` delimiters when feeding an LLM or MCP client.
      operationId: searchEvents
      parameters:
      - description: Natural-language semantic search query. Max 1024 characters;
          requires the embedder. When present, default sort is relevance.
        in: query
        maxLength: 1024
        name: q
        type: string
      - default: 0.5
        description: Match strictness for q. 0.0=broad, 1.0=strict. Default 0.5.
        in: query
        maximum: 1
        minimum: 0
        name: acc
        type: number
      - description: Only include records created on or after this date (RFC3339 timestamp).
        format: date-time
        in: query
        name: from
        type: string
      - description: Only include records created on or before this date (RFC3339
          timestamp).
        format: date-time
        in: query
        name: to
        type: string
      - collectionFormat: csv
        description: Restrict to known Event-family IDs (CSV). Prefer the detail route
          for one ID.
        in: query
        items:
          type: string
        name: ids
        type: array
      - collectionFormat: csv
        description: Allowlisted match against digest.event_type (CSV).
        in: query
        items:
          type: string
        name: event_types
        type: array
      - collectionFormat: csv
        description: 'Match digest.impact_level (CSV): low, medium, high.'
        in: query
        items:
          type: string
        name: impact_levels
        type: array
      - collectionFormat: csv
        description: Match digest.companies array (CSV).
        in: query
        items:
          type: string
        name: companies
        type: array
      - collectionFormat: csv
        description: Match digest.people array (CSV).
        in: query
        items:
          type: string
        name: people
        type: array
      - collectionFormat: csv
        description: Match digest.products array (CSV).
        in: query
        items:
          type: string
        name: products
        type: array
      - collectionFormat: csv
        description: Match digest.regions array (CSV).
        in: query
        items:
          type: string
        name: regions
        type: array
      - collectionFormat: csv
        description: Match the persisted source UUID, including direct SAME_AS evidence
          coverage (CSV).
        in: query
        items:
          type: string
        name: source_ids
        type: array
      - collectionFormat: csv
        description: Match persisted tags (CSV). tag_mode=any uses overlap; tag_mode=all
          requires every supplied tag.
        in: query
        items:
          type: string
        name: tags
        type: array
      - default: any
        description: Tag matching mode.
        enum:
        - any
        - all
        in: query
        name: tag_mode
        type: string
      - default: recent
        description: Sort order. recent=created_at desc (default), relevance=semantic
          distance asc (requires q).
        enum:
        - recent
        - relevance
        in: query
        name: sort
        type: string
      - default: json
        description: Output format. json returns the collection envelope; text returns
          compact plain-text records.
        enum:
        - json
        - text
        in: query
        name: response_type
        type: string
      - default: 20
        description: Page size. Default 20, max 128.
        in: query
        maximum: 128
        minimum: 1
        name: limit
        type: integer
      - description: Opaque pagination cursor returned as next_cursor. Clients must
          not construct or inspect it.
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      - text/plain
      responses:
        "200":
          description: Event-family records when response_type=json; plain-text event
            blocks when response_type=text
          schema:
            $ref: '#/definitions/router.EventCollectionResponse'
        "400":
          description: Invalid query parameters, malformed UUID, or malformed cursor
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Concurrency limit exceeded; retry shortly
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database or embedder unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Search Event-family records
      tags:
      - Events
  /events/{event_id}:
    get:
      description: What Event-family record has this UUID? Retrieves any record whose
        kind starts with `event` by UUID and returns its raw non-empty flattened digest
        members plus detail metadata links and relation counts. Returns 404 when no
        such record exists.
      operationId: getEvent
      parameters:
      - description: Event-family record UUID (RFC 4122).
        format: uuid
        in: path
        name: event_id
        required: true
        type: string
      - default: json
        description: Output format. json returns the detail envelope; text returns
          a compact plain-text record.
        enum:
        - json
        - text
        in: query
        name: response_type
        type: string
      produces:
      - application/json
      - text/plain
      responses:
        "200":
          description: The Event-family record
          schema:
            $ref: '#/definitions/router.EventDetailResponse'
        "400":
          description: Malformed UUID
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No Event-family record with this UUID
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Concurrency limit exceeded; retry shortly
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Retrieve one Event-family record
      tags:
      - Events
  /events/{event_id}/evidence:
    get:
      description: 'Which source-specific records support this Event? Returns a bare
        JSON list containing the requested Event and every direct SAME_AS Event-family
        neighbour in both relation orientations. Each item contains only event_id,
        created, source_id, url, and base_url. The default scope is direct_same_as:
        a bounded claim about current data, not a complete transitive equivalence
        closure.'
      operationId: getEventEvidence
      parameters:
      - description: Event-family record UUID (RFC 4122).
        format: uuid
        in: path
        name: event_id
        required: true
        type: string
      - collectionFormat: csv
        description: Restrict evidence to selected sources (CSV).
        in: query
        items:
          type: string
        name: source_ids
        type: array
      - description: Inclusive evidence created_at lower bound (RFC3339 timestamp).
        format: date-time
        in: query
        name: from
        type: string
      - description: Inclusive evidence created_at upper bound (RFC3339 timestamp).
        format: date-time
        in: query
        name: to
        type: string
      - default: json
        description: Output format. json returns the bare evidence list; text returns
          the same records as compact plain text.
        enum:
        - json
        - text
        in: query
        name: response_type
        type: string
      produces:
      - application/json
      - text/plain
      responses:
        "200":
          description: Bare Event evidence list
          schema:
            items:
              $ref: '#/definitions/router.EventEvidenceItem'
            type: array
        "400":
          description: Malformed UUID or invalid parameters
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No Event-family record with this UUID
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Concurrency limit exceeded; retry shortly
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Retrieve Event evidence
      tags:
      - Events
  /events/{event_id}/signals:
    get:
      description: Which broader conclusions use this Event as evidence? Returns Signals
        whose DERIVED_FROM edges target the requested Event or any of its direct SAME_AS
        equivalents. The caller does not need to know which Event-family record was
        used as the relation target. Returns 404 when the Event does not exist; 200
        with an empty collection when it exists but has no Signals.
      operationId: getEventSignals
      parameters:
      - description: Event-family record UUID (RFC 4122).
        format: uuid
        in: path
        name: event_id
        required: true
        type: string
      - description: Natural-language semantic search query. Max 1024 characters.
        in: query
        maxLength: 1024
        name: q
        type: string
      - default: 0.5
        description: Match strictness for q. 0.0=broad, 1.0=strict. Default 0.5.
        in: query
        maximum: 1
        minimum: 0
        name: acc
        type: number
      - description: Inclusive Signal created_at lower bound (RFC3339 timestamp).
        format: date-time
        in: query
        name: from
        type: string
      - description: Inclusive Signal created_at upper bound (RFC3339 timestamp).
        format: date-time
        in: query
        name: to
        type: string
      - collectionFormat: csv
        description: Match Signal digest.impact_level (CSV).
        in: query
        items:
          type: string
        name: impact_levels
        type: array
      - collectionFormat: csv
        description: Match Signal digest.impacted_domains array (CSV).
        in: query
        items:
          type: string
        name: impacted_domains
        type: array
      - collectionFormat: csv
        description: Match persisted tags (CSV). tag_mode=any uses overlap; tag_mode=all
          requires every supplied tag.
        in: query
        items:
          type: string
        name: tags
        type: array
      - default: any
        description: Tag matching mode.
        enum:
        - any
        - all
        in: query
        name: tag_mode
        type: string
      - default: recent
        description: Sort order. recent=created_at desc (default), relevance=semantic
          distance asc (requires q).
        enum:
        - recent
        - relevance
        in: query
        name: sort
        type: string
      - default: json
        description: Output format. json returns the collection envelope; text returns
          compact plain-text records.
        enum:
        - json
        - text
        in: query
        name: response_type
        type: string
      - default: 20
        description: Page size. Default 20, max 128.
        in: query
        maximum: 128
        minimum: 1
        name: limit
        type: integer
      - description: Opaque pagination cursor returned as next_cursor.
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      - text/plain
      responses:
        "200":
          description: Signals derived from this Event
          schema:
            $ref: '#/definitions/router.SignalCollectionResponse'
        "400":
          description: Malformed UUID, invalid cursor, or invalid parameters
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No Event-family record with this UUID
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Concurrency limit exceeded; retry shortly
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database or embedder unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Retrieve Signals derived from an Event
      tags:
      - Events
  /health:
    get:
      description: Lightweight liveness probe. Use it before other tools to confirm
        the Espresso backend is reachable. This endpoint does not require query parameters
        and returns only service status.
      operationId: healthCheck
      produces:
      - application/json
      responses:
        "200":
          description: Service is alive
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check API health
      tags:
      - Health
  /signals:
    get:
      description: |-
        Which synthesized conclusions or forecasts match my question? Returns signal-kind records. A Signal is returned intelligence, not a saved monitoring definition.
        **Search modes**: `q` + `acc` for semantic search (default sort becomes `relevance`); without `q` records are sorted by `created_at` descending (`recent`).
        **Time**: `from`/`to` are inclusive bounds on Signal `created_at`.
        **Tags**: match on persisted tags uses overlap (any supplied tag).
      operationId: searchSignals
      parameters:
      - description: Natural-language semantic search query. Max 1024 characters.
        in: query
        maxLength: 1024
        name: q
        type: string
      - default: 0.5
        description: Match strictness for q. 0.0=broad, 1.0=strict. Default 0.5.
        in: query
        maximum: 1
        minimum: 0
        name: acc
        type: number
      - description: Inclusive Signal created_at lower bound (RFC3339 timestamp).
        format: date-time
        in: query
        name: from
        type: string
      - description: Inclusive Signal created_at upper bound (RFC3339 timestamp).
        format: date-time
        in: query
        name: to
        type: string
      - collectionFormat: csv
        description: Restrict to known Signal IDs (CSV).
        in: query
        items:
          type: string
        name: ids
        type: array
      - collectionFormat: csv
        description: Match Signal digest.impact_level (CSV).
        in: query
        items:
          type: string
        name: impact_levels
        type: array
      - collectionFormat: csv
        description: Match Signal digest.impacted_domains array (CSV).
        in: query
        items:
          type: string
        name: impacted_domains
        type: array
      - collectionFormat: csv
        description: Match persisted tags (CSV). tag_mode=any uses overlap; tag_mode=all
          requires every supplied tag.
        in: query
        items:
          type: string
        name: tags
        type: array
      - default: any
        description: Tag matching mode.
        enum:
        - any
        - all
        in: query
        name: tag_mode
        type: string
      - default: recent
        description: Sort order. recent=created_at desc (default), relevance=semantic
          distance asc (requires q).
        enum:
        - recent
        - relevance
        in: query
        name: sort
        type: string
      - default: json
        description: Output format. json returns the collection envelope; text returns
          compact plain-text records.
        enum:
        - json
        - text
        in: query
        name: response_type
        type: string
      - default: 20
        description: Page size. Default 20, max 128.
        in: query
        maximum: 128
        minimum: 1
        name: limit
        type: integer
      - description: Opaque pagination cursor returned as next_cursor.
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      - text/plain
      responses:
        "200":
          description: Signal records
          schema:
            $ref: '#/definitions/router.SignalCollectionResponse'
        "400":
          description: Invalid query parameters, malformed UUID, or malformed cursor
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Concurrency limit exceeded; retry shortly
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database or embedder unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Search synthesized Signals
      tags:
      - Signals
  /signals/{signal_id}:
    get:
      description: What is the complete Signal with this UUID? Retrieves one signal-kind
        record by UUID. The detail payload links to supporting Events instead of inventing
        inline event references from unstructured digest strings. Returns 404 when
        no such Signal exists.
      operationId: getSignal
      parameters:
      - description: Signal record UUID (RFC 4122).
        format: uuid
        in: path
        name: signal_id
        required: true
        type: string
      - default: json
        description: Output format. json returns the detail envelope; text returns
          a compact plain-text record.
        enum:
        - json
        - text
        in: query
        name: response_type
        type: string
      produces:
      - application/json
      - text/plain
      responses:
        "200":
          description: The Signal record
          schema:
            $ref: '#/definitions/router.SignalDetailResponse'
        "400":
          description: Malformed UUID
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No Signal with this UUID
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Concurrency limit exceeded; retry shortly
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Retrieve one Signal
      tags:
      - Signals
  /signals/{signal_id}/events:
    get:
      description: Which Event-family records support this Signal? Follows DERIVED_FROM
        edges in the stored signal-to-event direction and returns raw non-empty flattened
        digest members from direct Event-family targets. Returns 404 when the Signal
        does not exist; 200 with an empty collection when it exists but has no supporting
        Events.
      operationId: getSignalEvents
      parameters:
      - description: Signal record UUID (RFC 4122).
        format: uuid
        in: path
        name: signal_id
        required: true
        type: string
      - description: Natural-language semantic search query. Max 1024 characters.
        in: query
        maxLength: 1024
        name: q
        type: string
      - default: 0.5
        description: Match strictness for q. 0.0=broad, 1.0=strict. Default 0.5.
        in: query
        maximum: 1
        minimum: 0
        name: acc
        type: number
      - description: Inclusive Event created_at lower bound (RFC3339 timestamp).
        format: date-time
        in: query
        name: from
        type: string
      - description: Inclusive Event created_at upper bound (RFC3339 timestamp).
        format: date-time
        in: query
        name: to
        type: string
      - collectionFormat: csv
        description: Match digest.event_type (CSV).
        in: query
        items:
          type: string
        name: event_types
        type: array
      - collectionFormat: csv
        description: Match digest.impact_level (CSV).
        in: query
        items:
          type: string
        name: impact_levels
        type: array
      - collectionFormat: csv
        description: Match persisted tags (CSV). tag_mode=any uses overlap; tag_mode=all
          requires every supplied tag.
        in: query
        items:
          type: string
        name: tags
        type: array
      - default: any
        description: Tag matching mode.
        enum:
        - any
        - all
        in: query
        name: tag_mode
        type: string
      - default: recent
        description: Sort order. recent=created_at desc (default), relevance=semantic
          distance asc (requires q).
        enum:
        - recent
        - relevance
        in: query
        name: sort
        type: string
      - default: json
        description: Output format. json returns the collection envelope; text returns
          compact plain-text records.
        enum:
        - json
        - text
        in: query
        name: response_type
        type: string
      - default: 20
        description: Page size. Default 20, max 128.
        in: query
        maximum: 128
        minimum: 1
        name: limit
        type: integer
      - description: Opaque pagination cursor returned as next_cursor.
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      - text/plain
      responses:
        "200":
          description: Event-family records supporting this Signal
          schema:
            $ref: '#/definitions/router.EventCollectionResponse'
        "400":
          description: Malformed UUID, invalid cursor, or invalid parameters
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: No Signal with this UUID
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Concurrency limit exceeded; retry shortly
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Database or embedder unavailable; retry
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Retrieve Event-family records supporting a Signal
      tags:
      - Signals
  /sources:
    get:
      description: Which source records can I filter by or cite? Returns provenance
        records keyed by UUID. Optional source metadata may be null; missing optional
        metadata is not an error and the API does not fabricate names, domains, or
