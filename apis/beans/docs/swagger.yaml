    - meta
    - pagination
    type: object
  router.TagDocument:
    properties:
      type:
        type: string
      value:
        type: string
    type: object
  router.Trend:
    properties:
      audience:
        type: integer
      comments:
        type: integer
      likes:
        type: integer
      mentions:
        type: integer
      related:
        type: integer
      trend_score:
        type: number
    type: object
info:
  contact:
    email: soumitsrah@cafecito.tech
    name: Project Cafecito
    url: https://cafecito.tech
  description: Beans finds and verifies what publishers published. It returns citable
    Articles, Source metadata, attention-ranked feeds, similar publisher reading,
    external Article mentions, and normalized filter discovery.
  license:
    name: MIT
  title: Beans News API & MCP
  version: "1.0"
paths:
  /articles/{id}:
    get:
      description: |-
        Answers: What did this specific publisher Article say?
        Returns: One Article detail record inside data, identified by the Article UUID, with links for similar Articles and observed external mentions.
        Use when: an agent already has an Article UUID and needs citable metadata, Source context, or optional full content.
        Do not use when: the Article UUID is unknown; use search or a feed first.
        Search/filter behavior: the path UUID is exact; full_content=true requests the available body without changing identity.
        Time: published_at is the publisher publication timestamp; this route has no time window.
        Sort/pagination: one detail record; no cursor or ordering applies.
        Missing fields: title, summary, author, image, Source metadata, story_id, and content may be null or omitted.
        Next step: follow links.similar for ranked related reading or links.mentions for external observations.
      operationId: getArticle
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.ArticleDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Get an Article
      tags:
      - Articles
  /articles/{id}/mentions:
    get:
      description: |-
        Answers: Where was this Article URL observed on external social or forum platforms?
        Returns: A cursor-paginated collection of external mention observations; a mention is not another publisher Article.
        Use when: external attention or discussion observations are needed for a known Article.
        Do not use when: publisher republication coverage or related reading is needed.
        Search/filter behavior: the path UUID is exact; optional platforms and forums filters select mention metadata.
        Time: from and to are inclusive UTC observation-date bounds in YYYY-MM-DD.
        Sort/pagination: observed-time order; follow pagination.next_cursor unchanged as cursor. limit defaults to 20 and is capped at 100.
        Missing fields: forum and engagement metrics may be null; empty results are HTTP 200 with data: [].
        Next step: use GET /articles/{id} to return to the Article citation or GET /articles/trending for aggregate attention ranking.
      operationId: getArticleMentions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.MentionCollectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: List Article Mentions
      tags:
      - Articles
  /articles/{id}/similar:
    get:
      description: |-
        Answers: Which other publisher Articles are useful related reading for this Article?
        Returns: A cursor-paginated collection of related publisher coverage for the path Article, ordered newest first; this is not a guarantee of Story membership.
        Use when: an agent has selected an Article and wants comparable coverage or related context.
        Do not use when: all Articles in a durable Story or external mentions are needed.
        Search/filter behavior: the path UUID is the related-coverage anchor. Source, domain, author, label, content-type, and date filters narrow candidates; full_content changes only the Article projection; q, score_threshold, ids, and urls are not accepted.
        Time: from and to are inclusive UTC publication-date bounds in YYYY-MM-DD.
        Sort/pagination: published_at descending; follow pagination.next_cursor unchanged as cursor. limit defaults to 20 and is capped at 100.
        Missing fields: Article enrichment, Source metadata, and content may be null or omitted.
        Next step: use GET /articles/{id} on a selected result for detail and optional full content.
      operationId: getSimilarArticles
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.ArticleCollectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Find Similar Articles
      tags:
      - Articles
  /articles/latest:
    get:
      description: |-
        Answers: What Articles were published most recently within the requested filters?
        Returns: A cursor-paginated collection of publisher Articles ordered newest first. Empty results are HTTP 200 with data: [].
        Use when: publication recency matters more than full-corpus relevance.
        Do not use when: semantic archive search, headline attention, or trend ranking is needed; use search, top-headlines, or trending.
        Search/filter behavior: accepts q, score_threshold with q, Article filters, and full_content. Include values use OR within a field; different fields combine with AND.
        Time: this feed uses a fixed recent seven-day UTC publication window; from and to are not accepted.
        Sort/pagination: newest published_at first; follow pagination.next_cursor unchanged as cursor. limit defaults to 20 and is capped at 100.
        Missing fields: Article enrichment and Source metadata are nullable; content requires full_content=true and availability.
        Next step: use GET /articles/{id} for detail or GET /articles/trending when attention matters more than recency.
      operationId: getLatestArticles
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.ArticleCollectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: List Latest Articles
      tags:
      - Articles
  /articles/search:
    get:
      description: |-
        Answers: Which publisher Articles match this topic, identity, Source, label, or publication-date query?
        Returns: A cursor-paginated collection where each data item is one publisher Article identified by UUID. Empty results are HTTP 200 with data: [].
        Use when: broad Article retrieval, semantic topic search, exact Article IDs or URLs, or combined Article filters are needed.
        Do not use when: newest-only, headline-only, or attention-ranked results are needed; use latest, top-headlines, or trending.
        Search/filter behavior: q is semantic natural-language search; score_threshold requires q. ids and urls are exact. Include values use OR within a field; different fields combine with AND. full_content changes only the Article projection.
        Time: from and to are inclusive UTC publication-date bounds in YYYY-MM-DD form.
        Sort/pagination: follow pagination.next_cursor unchanged as cursor. limit defaults to 20 and is capped at 100. offset and page are not supported.
        Missing fields: Article enrichment, Source metadata, story_id, content, and trend may be null or omitted. Content requires full_content=true and source availability.
        Next step: use GET /articles/{id} for one selected Article, then follow its similar or mentions link.
      operationId: searchArticles
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.ArticleCollectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Search Articles
      tags:
      - Articles
  /articles/trending:
    get:
      description: |-
        Answers: Which Articles are receiving the most observed attention within the requested window?
        Returns: A cursor-paginated collection of Articles ordered by attention, with nullable trend metrics when available. Empty results are HTTP 200 with data: [].
        Use when: an agent needs what is gaining attention now rather than only what was published most recently.
        Do not use when: chronological monitoring or a fixed headline window is needed; use latest or top-headlines.
        Search/filter behavior: accepts q with optional score_threshold and the shared Article filters; filters narrow candidates before attention ordering.
        Time: from and to are inclusive UTC dates applied to observed trend activity; omitted from defaults to the most recent 7 days.
        Sort/pagination: attention-ranked order; follow pagination.next_cursor unchanged as cursor. limit defaults to 20 and is capped at 100.
        Missing fields: trend and each metric can be absent or null; zero is not fabricated when unavailable.
        Next step: use GET /articles/{id} for detail or GET /articles/{id}/similar for related reading.
      operationId: getTrendingArticles
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.ArticleCollectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: List Trending Articles
      tags:
      - Articles
  /categories:
    get:
      description: |-
        Answers: Which normalized category labels can I use as Article filters?
        Returns: A cursor-paginated collection of category labels used by Article records.
        Use when: an agent has an unknown category spelling and needs discovery before Article filtering.
        Do not use when: a known normalized label is already available; query Articles directly.
        Search/filter behavior: q performs case-insensitive discovery matching; returned values are normalized labels.
        Time: no time filter applies.
        Sort/pagination: follow pagination.next_cursor unchanged as cursor. limit defaults to 20 and is capped at 100.
        Missing fields: the collection may be empty; this route does not define a taxonomy hierarchy.
        Next step: carry a returned value into the categories Article filter.
      operationId: listCategories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.TagCollectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: List Category Labels
      tags:
      - Discovery
  /entities:
    get:
      description: |-
        Answers: Which normalized entity labels can I use as Article filters?
        Returns: A cursor-paginated collection of extracted entity labels. Values are labels, not canonical entity profiles or IDs.
        Use when: an agent has an unknown entity spelling and needs discovery before Article filtering.
        Do not use when: a known normalized label is already available; query Articles directly.
        Search/filter behavior: q performs case-insensitive discovery matching.
        Time: no time filter applies.
        Sort/pagination: follow pagination.next_cursor unchanged as cursor. limit defaults to 20 and is capped at 100.
        Missing fields: the collection may be empty; no entity type or confidence is promised.
        Next step: carry a returned value into the entities Article filter.
      operationId: listEntities
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.TagCollectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: List Entity Labels
      tags:
      - Discovery
  /health:
    get:
      description: Lightweight liveness probe. Use before other tools to confirm the
        service is reachable. No authentication required when API keys are disabled.
      operationId: healthCheck
      produces:
      - application/json
      responses:
        "200":
          description: status alive
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check API health
      tags:
      - Health
  /regions:
    get:
      description: |-
        Answers: Which normalized extracted region labels can I use as Article filters?
        Returns: A cursor-paginated collection of region labels, not country codes, coordinates, or radius-search objects.
        Use when: an agent has an unknown region spelling and needs discovery before Article filtering.
        Do not use when: a known normalized label is already available; query Articles directly.
        Search/filter behavior: q performs case-insensitive discovery matching.
        Time: no time filter applies.
        Sort/pagination: follow pagination.next_cursor unchanged as cursor. limit defaults to 20 and is capped at 100.
        Missing fields: the collection may be empty; structured geography is not promised.
        Next step: carry a returned value into the regions Article filter.
      operationId: listRegions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.TagCollectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: List Region Labels
      tags:
      - Discovery
  /sentiments:
    get:
      description: |-
        Answers: Which categorical sentiment labels can I use as Article filters?
        Returns: A cursor-paginated collection of sentiment labels observed on Articles.
        Use when: an agent has an unknown sentiment spelling and needs discovery before Article filtering.
        Do not use when: a known label is already available; query Articles directly.
        Search/filter behavior: q performs case-insensitive discovery matching; sentiments are categorical labels, not calibrated numeric scores.
        Time: no time filter applies.
        Sort/pagination: follow pagination.next_cursor unchanged as cursor. limit defaults to 20 and is capped at 100.
        Missing fields: the collection may be empty; no confidence or numeric sentiment score is returned.
        Next step: carry a returned value into the sentiments Article filter.
      operationId: listSentiments
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.TagCollectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: List Sentiment Labels
      tags:
      - Discovery
  /sources:
    get:
      description: |-
        Answers: Which publisher Sources match this metadata query?
        Returns: A cursor-paginated collection where each data item is one Source identified by UUID. Source records describe publishers; they are not Articles.
        Use when: an agent needs Source metadata for citations or a Source UUID for Article filtering.
        Do not use when: Article content or publication search is needed; use GET /articles/search or a feed.
        Search/filter behavior: q performs case-insensitive metadata matching across domain, name, and URL; domains are exact filters.
        Time: no time filter applies; Source metadata is current as returned.
        Sort/pagination: follow pagination.next_cursor unchanged as cursor. limit defaults to 20 and is capped at 100.
        Missing fields: name, description, favicon_url, and rss_feed_url may be null when unavailable.
        Next step: use GET /sources/{id} for one Source or carry its UUID into Article sources filters.
      operationId: listSources
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.SourceCollectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: List Sources
      tags:
      - Sources
  /sources/{id}:
    get:
      description: |-
        Answers: What publisher metadata belongs to this Source UUID?
        Returns: One Source detail record inside data. Optional display metadata is returned only when available.
        Use when: an agent needs to enrich an Article citation or inspect a known publisher.
        Do not use when: the agent needs Articles from this Source; use GET /articles/search with sources.
        Search/filter behavior: the path UUID is exact; no collection filters apply.
        Time: no time filter applies.
        Sort/pagination: one detail record; no cursor or ordering applies.
        Missing fields: name, description, favicon_url, and rss_feed_url may be null.
        Next step: use the Source UUID in Article search filters.
      operationId: getSource
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.SourceDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Get a Source
      tags:
      - Sources
  /top-headlines:
    get:
      description: |-
        Answers: Which Articles are attracting headline-level attention in the fixed recent window?
        Returns: A cursor-paginated collection from the most recent 24-hour window, ordered by attention. Empty results are HTTP 200 with data: [].
        Use when: a breaking-news or daily-headline feed is needed without choosing a custom time range.
        Do not use when: historical bounds, full-corpus search, or a 7-day trend window is needed; use search, latest, or trending.
        Search/filter behavior: accepts Article filters and q with optional score_threshold; exact ids and urls belong to search.
        Time: the service applies a fixed recent 24-hour creation and attention window; from and to are not accepted.
        Sort/pagination: attention-ranked order; follow pagination.next_cursor unchanged as cursor. limit defaults to 20 and is capped at 100.
        Missing fields: summary, content, enrichment, Source metadata, and trend metrics may be absent or null.
        Next step: use GET /articles/{id} when a headline needs citable detail or full content.
      operationId: getTopHeadlines
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.ArticleCollectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "401":
          description: Unauthorized
