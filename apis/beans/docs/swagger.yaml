info:
  contact:
    email: soumitsrah@cafecito.tech
    name: Project Cafecito
    url: https://cafecito.tech
  description: |-
    Beans is a publisher-content API for news, blogs, financial and earnings reports, litigation and lawsuits, official statements, research, technical documents, and related coverage context.
    Beans finds and verifies what publishers published. It returns citable Articles, Source metadata, attention-ranked feeds, similar publisher reading, external Article mentions, and normalized filter discovery.
    Collections return `{data, pagination, meta}`. pagination contains `limit`, `num_results` (this page only), and `next_cursor`. Empty collections return HTTP 200 with `data: []`. Missing detail resources return HTTP 404. Errors return `{ "error": { "code", "message" } }`.
    `content_type=post` is not a valid request filter. `post` may still appear on Article responses. Unknown or route-inapplicable query parameters return HTTP 400.
    Backend authentication uses the `X-API-KEY` header (or other headers listed in `API_KEY`). `/health` does not require a key. Public clients send Bearer keys to the gateway, not this service.
  license:
    name: MIT
  title: Beans News API & MCP
  version: "1.0"
paths:
  /articles/{id}:
    get:
      description: Returns one Article selected by UUID. Set full_content=true to
        request content when available.
      operationId: getArticle
      parameters:
      - description: Article UUID.
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - default: false
        description: Include content when available.
        in: query
        name: full_content
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.ArticleDetailResponse'
        "400":
          description: Invalid parameters
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: Article not found
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Service unavailable
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      security:
      - BackendAPIKey: []
      summary: Get an Article
      tags:
      - Articles
  /articles/{id}/mentions:
    get:
      description: Returns external platform or forum observations for an Article
        UUID, ordered by observation time.
      operationId: getArticleMentions
      parameters:
      - description: Article UUID.
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - collectionFormat: csv
        description: Mention platforms (CSV).
        in: query
        items:
          type: string
        name: platforms
        type: array
      - collectionFormat: csv
        description: Mention forums (CSV).
        in: query
        items:
          type: string
        name: forums
        type: array
      - description: UTC lower observation timestamp.
        format: date
        in: query
        name: from
        type: string
      - description: UTC upper observation timestamp.
        format: date
        in: query
        name: to
        type: string
      - default: 20
        description: Maximum records per page. Default 20, max 100.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque continuation token from pagination.next_cursor. Send it
          unchanged.
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.MentionCollectionResponse'
        "400":
          description: Invalid parameters
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: Article not found
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Service unavailable
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      security:
      - BackendAPIKey: []
      summary: List Article mentions
      tags:
      - Articles
  /articles/{id}/similar:
    get:
      description: Returns related Articles for an Article UUID, ordered newest first.
        It is not a relevance-ranked search route.
      operationId: getSimilarArticles
      parameters:
      - description: Article UUID.
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Filterable Article type. post is response-only and returns 400.
        enum:
        - blog
        - contract
        - earnings_report
        - enforcement_action
        - financial_report
        - lawsuit
        - news
        - official_statement
        - podcast
        - press_release
        - research_paper
        - site
        - technical_documentation
        - whitepaper
        in: query
        name: content_type
        type: string
      - collectionFormat: csv
        description: Source UUIDs to include (CSV).
        in: query
        items:
          type: string
        name: sources
        type: array
      - collectionFormat: csv
        description: Source UUIDs to exclude (CSV).
        in: query
        items:
          type: string
        name: exclude_sources
        type: array
      - collectionFormat: csv
        description: Source domains to include (CSV).
        in: query
        items:
          type: string
        name: domains
        type: array
      - collectionFormat: csv
        description: Source domains to exclude (CSV).
        in: query
        items:
          type: string
        name: exclude_domains
        type: array
      - collectionFormat: csv
        description: Author text filters (CSV).
        in: query
        items:
          type: string
        name: authors
        type: array
      - collectionFormat: csv
        description: Category values (CSV).
        in: query
        items:
          type: string
        name: categories
        type: array
      - collectionFormat: csv
        description: Excluded category values (CSV).
        in: query
        items:
          type: string
        name: exclude_categories
        type: array
      - collectionFormat: csv
        description: Region values (CSV).
        in: query
        items:
          type: string
        name: regions
        type: array
      - collectionFormat: csv
        description: Entity values (CSV).
        in: query
        items:
          type: string
        name: entities
        type: array
      - collectionFormat: csv
        description: Sentiment values (CSV).
        in: query
        items:
          type: string
        name: sentiments
        type: array
      - collectionFormat: csv
        description: Normalized tag terms (CSV).
        in: query
        items:
          type: string
        name: tags
        type: array
      - description: UTC lower timestamp bound.
        format: date
        in: query
        name: from
        type: string
      - description: UTC upper timestamp bound.
        format: date
        in: query
        name: to
        type: string
      - default: false
        description: Include content when available.
        in: query
        name: full_content
        type: boolean
      - default: 20
        description: Maximum records per page. Default 20, max 100.
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Opaque continuation token from pagination.next_cursor. Send it
          unchanged.
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.ArticleCollectionResponse'
        "400":
          description: Invalid parameters
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "404":
          description: Article not found
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Service unavailable
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      security:
      - BackendAPIKey: []
      summary: List related Articles
      tags:
      - Articles
