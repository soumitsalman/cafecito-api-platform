    properties:
      author:
        type: string
      categories:
        items:
          type: string
        type: array
      content:
        type: string
      content_type:
        enum:
        - blog
        - contract
        - earnings_report
        - enforcement_action
        - financial_report
        - lawsuit
        - news
        - official_statement
        - podcast
        - post
        - press_release
        - research_paper
        - site
        - technical_documentation
        - whitepaper
        type: string
      entities:
        items:
          type: string
        type: array
      id:
        format: uuid
        type: string
      image_url:
        type: string
      published_at:
        format: date-time
        type: string
      regions:
        items:
          type: string
        type: array
      sentiments:
        items:
          type: string
        type: array
      source:
        $ref: '#/definitions/router.SourceDocument'
      story_id:
        description: 'StoryID    *uuid.UUID     `json:"story_id" swaggertype:"string"
          format:"uuid"` // TODO: enable this later'
        type: string
      summary:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      trend:
