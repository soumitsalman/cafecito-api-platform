  router.ErrorResponse:
    properties:
      error: {}
    type: object
  router.MentionCollectionResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/router.MentionDocument'
        type: array
      meta:
        $ref: '#/definitions/router.ResponseMeta'
      pagination:
        $ref: '#/definitions/router.Pagination'
    required:
