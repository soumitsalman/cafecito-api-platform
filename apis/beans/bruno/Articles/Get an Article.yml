info:
  name: Get an Article
  type: http
  seq: 4
  tags:
    - Articles

http:
  method: GET
  url: "{{baseUrl}}/articles/:id?full_content=true"
  params:
    - name: full_content
      value: "true"
      type: query
    - name: id
      value: ad5ea4c6-7e4d-538a-9268-d36450a70a44
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

