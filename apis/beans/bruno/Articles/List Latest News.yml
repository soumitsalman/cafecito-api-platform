docs: |-
  Answers: What news Articles were published most recently within the requested filters?
  Returns: A cursor-paginated collection of news Articles ordered newest first. Empty results are HTTP 200 with data: [].
  Use when: publication recency for news only matters more than full-corpus relevance.
  Do not use when: mixed content types, semantic archive search, headline attention, or trend ranking is needed; use latest, search, top-headlines, or trending.
  Search/filter behavior: news-scoped shortcut equivalent to GET /articles/latest?content_type=news. Accepts q, score_threshold with q, Article scope filters, and full_content. Does not accept content_type, ids, urls, from, or to.
  Time: this feed uses a fixed recent seven-day UTC publication window; from and to are not accepted.
  Sort/pagination: newest published_at first; follow pagination.next_cursor unchanged as cursor. limit defaults to 20 and is capped at 100.
  Missing fields: Article enrichment and Source metadata are nullable; content requires full_content=true and availability.
  Next step: use GET /articles/{id} for detail or GET /news/trending when attention matters more than recency.
