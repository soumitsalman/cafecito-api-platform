info:
  name: List Latest News
  type: http
  seq: 8
  tags:
    - Articles

http:
  method: GET
  url: "{{baseUrl}}/news/latest?tags=startups&languages=en,es"
  params:
    - name: tags
      value: startups
      type: query
    - name: domains
      value: substack
      type: query
      disabled: true
    - name: full_content
      value: "true"
      type: query
      disabled: true
    - name: languages
      value: en,es
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

