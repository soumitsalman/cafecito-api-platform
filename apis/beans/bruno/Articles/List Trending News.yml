info:
  name: List Trending News
  type: http
  seq: 9
  tags:
    - Articles

http:
  method: GET
  url: "{{baseUrl}}/news/trending?tags=politics&languages=en,es"
  params:
    - name: tags
      value: politics
      type: query
    - name: languages
      value: en,es
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

