docs: |-
  Answers: Which news Articles are receiving the most observed attention within the requested window?
  Returns: A cursor-paginated collection of news Articles ordered by attention, with nullable trend metrics when available. Empty results are HTTP 200 with data: [].
  Use when: an agent needs news that is gaining attention now rather than only what was published most recently.
  Do not use when: mixed content types, chronological monitoring, or a fixed headline window is needed; use trending, latest, or top-headlines.
  Search/filter behavior: news-scoped shortcut equivalent to GET /articles/trending?content_type=news. Accepts q with optional score_threshold and Article scope filters. Does not accept content_type, ids, urls, from, or to.
  Time: this feed uses a fixed recent seven-day window; from and to are not accepted.
  Sort/pagination: attention-ranked order; follow pagination.next_cursor unchanged as cursor. limit defaults to 20 and is capped at 100.
  Missing fields: trend and each metric can be absent or null; zero is not fabricated when unavailable.
  Next step: use GET /articles/{id} for detail or GET /articles/{id}/similar for related reading.
