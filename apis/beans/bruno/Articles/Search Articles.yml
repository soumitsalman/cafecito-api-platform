info:
  name: Search Articles
  type: http
  seq: 2
  tags:
    - Articles

http:
  method: GET
  url: "{{baseUrl}}/articles/search?q=topic+active+cybersecurity+breach+exclude+general+cybersecurity+best+practice&limit=20"
  params:
    - name: q
      value: topic+active+cybersecurity+breach+exclude+general+cybersecurity+best+practice
      type: query
    - name: limit
      value: "20"
      type: query
    - name: xxy
      value: hello
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

