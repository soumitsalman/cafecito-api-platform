info:
  name: List Unique Articles
  type: http
  seq: 1
  tags:
    - Private

http:
  method: GET
  url: "{{baseUrl}}/private/articles/unique?sort=recent&limit=20"
  params:
    - name: sort
      value: recent
      type: query
    - name: q
      value: ""
      type: query
      disabled: true
    - name: limit
      value: "20"
      type: query
    - name: languages
      value: en,es
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

