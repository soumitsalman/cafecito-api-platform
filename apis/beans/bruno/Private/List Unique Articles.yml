docs: |-
  Internal only. Not part of the public API.
  Answers: Which Articles remain after keeping one member per Story, ordered by the selected sort?
  Returns: A cursor-paginated Article collection with trend fields.
  Sort: sort is recent (default), trend, or relevant. sort=relevant requires q. sort=trend applies from and to to the observation window as well as publication bounds.
  Search/filter behavior: accepts the article search filters, including q, score_threshold, ids, urls, content_type, source, domain, author, label, languages, and full_content.
  Time: from and to are inclusive UTC dates in YYYY-MM-DD.
  Sort/pagination: follow pagination.next_cursor unchanged as cursor. A cursor from a different sort is rejected. limit defaults to 20 and is capped at 100.
