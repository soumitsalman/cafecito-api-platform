info:
  name: List Story Articles
  type: http
  seq: 3
  tags:
    - preview

http:
  method: GET
  url: "{{baseUrl}}/preview/stories/:id/articles"
  params:
    - name: id
      value: 0325c4ec-8881-5597-b8dd-a8a6eae19c49
      type: path
    - name: content_type
      value: news
      type: query
    - name: limit
      value: "20"
      type: query
    - name: languages
      value: en,es
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

