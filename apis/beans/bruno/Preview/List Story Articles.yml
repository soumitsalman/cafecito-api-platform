docs: |-
  Internal only. Not part of the public API.
  Answers: Which publisher Articles belong to this Story UUID?
  Returns: A cursor-paginated story-article collection. meta.story_id is the requested Story. Each item includes id, url, title, published_at, story_id, and source id, url, domain, and name. Other article fields are null or empty. full_content=true adds content when available.
  Search/filter behavior: the path UUID is the Story. Source, domain, author, label, languages, content-type, and date filters narrow members. q, score_threshold, ids, and urls are not accepted.
  Time: from and to are inclusive UTC publication-date bounds in YYYY-MM-DD.
  Sort/pagination: published_at descending; follow pagination.next_cursor unchanged as cursor. limit defaults to 20 and is capped at 100.
  Missing id: 404 when the path Story does not exist.
