docs: |-
  Internal only. Not part of the public API.
  Answers: Which related Articles exist for this Article, as a compact preview with trend?
  Returns: A cursor-paginated collection of id, url, title, published_at, source, and trend. This is not Story membership.
  Search/filter behavior: the path UUID is the related-coverage anchor. Source, domain, author, label, languages, content-type, and date filters narrow candidates. q, score_threshold, ids, and urls are not accepted.
  Time: from and to are inclusive UTC publication-date bounds in YYYY-MM-DD.
  Sort/pagination: published_at descending; follow pagination.next_cursor unchanged as cursor. limit defaults to 20 and is capped at 100.
  Missing id: 404 when the path Article does not exist.
