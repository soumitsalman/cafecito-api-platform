info:
  name: Find Similar Articles
  type: http
  seq: 2
  tags:
    - preview

http:
  method: GET
  url: "{{baseUrl}}/preview/articles/:id/similar"
  params:
    - name: id
      value: e15d0fe2-079b-530a-8799-160fe7cae066
      type: path
    - name: limit
      value: "20"
      type: query
    - name: languages
      value: en,es
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

