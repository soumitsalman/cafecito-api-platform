info:
  name: Check API health
  type: http
  seq: 1
  tags:
    - Health
http:
  method: GET
  url: "{{baseUrl}}/health"
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
examples:
  - name: 200 Response
    description: status alive
    request:
      url: "{{baseUrl}}/health"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
docs: Lightweight liveness probe. Use before other tools to confirm the service
  is reachable. No authentication required when API keys are disabled.
