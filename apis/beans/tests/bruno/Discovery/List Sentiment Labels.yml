docs: >-
  Answers: Which categorical sentiment labels can I use as Article filters?

  Returns: A cursor-paginated collection of sentiment labels observed on
  Articles.

  Use when: an agent has an unknown sentiment spelling and needs discovery
  before Article filtering.

  Do not use when: a known label is already available; query Articles directly.

  Search/filter behavior: q performs case-insensitive discovery matching;
  sentiments are categorical labels, not calibrated numeric scores.

  Time: no time filter applies.

  Sort/pagination: follow pagination.next_cursor unchanged as cursor. limit
  defaults to 20 and is capped at 100.

  Missing fields: the collection may be empty; no confidence or numeric
  sentiment score is returned.

  Next step: carry a returned value into the sentiments Article filter.
