docs: >-
  Answers: Which normalized entity labels can I use as Article filters?

  Returns: A cursor-paginated collection of extracted entity labels. Values are
  labels, not canonical entity profiles or IDs.

  Use when: an agent has an unknown entity spelling and needs discovery before
  Article filtering.

  Do not use when: a known normalized label is already available; query Articles
  directly.

  Search/filter behavior: q performs case-insensitive discovery matching.

  Time: no time filter applies.

  Sort/pagination: follow pagination.next_cursor unchanged as cursor. limit
  defaults to 20 and is capped at 100.

  Missing fields: the collection may be empty; no entity type or confidence is
  promised.

  Next step: carry a returned value into the entities Article filter.
