info:
  name: List Sources
  type: http
  seq: 1
  tags:
    - Sources
http:
  method: GET
  url: "{{baseUrl}}/sources"
  params:
    - name: q
      value: tech
      type: query
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/sources"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "description": "",
                "domain": "",
                "favicon_url": "",
                "id": "",
                "name": "",
                "rss_feed_url": "",
                "url": ""
              }
            ],
            "meta": {
              "as_of": ""
            },
            "pagination": {
              "limit": 0,
              "next_cursor": "",
              "num_results": 0
            }
          }
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/sources"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "invalid_request",
              "message": ""
            }
          }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/sources"
