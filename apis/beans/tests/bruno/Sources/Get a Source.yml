info:
  name: Get a Source
  type: http
  seq: 2
  tags:
    - Sources

http:
  method: GET
  url: "{{baseUrl}}/sources/:id"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/sources/:id"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "description": "",
              "domain": "",
              "favicon_url": "",
              "id": "",
              "name": "",
              "rss_feed_url": "",
              "url": ""
            }
          }
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/sources/:id"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": ""
          }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/sources/:id"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": ""
          }
  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/sources/:id"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": ""
          }
  - name: 429 Response
    description: Too Many Requests
    request:
      url: "{{baseUrl}}/sources/:id"
      method: GET
    response:
      status: 429
      statusText: Too Many Requests
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": ""
          }
  - name: 500 Response
    description: Internal Server Error
    request:
      url: "{{baseUrl}}/sources/:id"
      method: GET
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": ""
          }

docs: |-
  Answers: What publisher metadata belongs to this Source UUID?
  Returns: One Source detail record inside data. Optional display metadata is returned only when available.
  Use when: an agent needs to enrich an Article citation or inspect a known publisher.
  Do not use when: the agent needs Articles from this Source; use GET /articles/search with sources.
  Search/filter behavior: the path UUID is exact; no collection filters apply.
  Time: no time filter applies.
  Sort/pagination: one detail record; no cursor or ordering applies.
  Missing fields: name, description, favicon_url, and rss_feed_url may be null.
  Next step: use the Source UUID in Article search filters.
