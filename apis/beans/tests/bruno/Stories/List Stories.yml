info:
  name: List Stories
  type: http
  seq: 1
  tags:
    - Stories
http:
  method: GET
  url: "{{baseUrl}}/stories"
  params:
    - name: q
      value: technology
      type: query
    - name: min_article_count
      value: "2"
      type: query
    - name: limit
      value: "20"
      type: query
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
examples:
