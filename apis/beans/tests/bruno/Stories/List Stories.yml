docs: >-
  Answers: Which related-coverage Stories match this query?

  Returns: A cursor-paginated Story collection. Each data item has a stable
  Story UUID; member Articles are retrieved separately.

  Use when: a news workflow needs to group related publisher coverage before
  selecting a Story.

  Request parameters: q is optional natural-language Story search text;
  min_article_count defaults to 2; limit is 1-100; cursor continues the same
  query.

  Do not use when: one known Story UUID is already available; use GET
  /stories/{id} or GET /stories/{id}/articles.

  Response handoff: preserve data[].id as an opaque UUID for the Story detail
  and member-Article calls.

  Next step: call GET /stories/{id} for Story metadata or GET
  /stories/{id}/articles for member Articles.
