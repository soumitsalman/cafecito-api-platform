    description: OK
    request:
      url: "{{baseUrl}}/stories"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "pagination": {
              "limit": 20,
              "num_results": 1,
              "next_cursor": null
            },
            "meta": {
              "as_of": "2026-08-24T00:00:00Z"
            },
            "data": [
              {
                "id": "0325c4ec-8881-5597-b8dd-a8a6eae19c49",
                "title": "Example Story",
                "first_published_at": "2026-08-20T10:00:00Z",
                "last_published_at": "2026-08-24T10:00:00Z",
                "article_count": 4,
                "source_count": 3,
                "categories": [
                  "technology"
                ],
                "regions": [],
                "entities": [],
                "tags": [
                  "technology"
                ],
                "top_articles": []
              }
            ]
