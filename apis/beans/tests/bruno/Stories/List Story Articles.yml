info:
  name: List Story Articles by UUID
  type: http
  seq: 3
  tags:
    - Stories
http:
  method: GET
  url: "{{baseUrl}}/stories/:id/articles"
  params:
    - name: id
      value: 0325c4ec-8881-5597-b8dd-a8a6eae19c49
      type: path
    - name: content_type
      value: news
      type: query
    - name: limit
      value: "20"
      type: query
  auth: inherit
