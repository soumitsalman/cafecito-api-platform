docs: >-
  Answers: Which publisher Articles belong to this Story UUID?

  Returns: A cursor-paginated Article collection. meta.story_id identifies the
  requested Story and each member Article carries the same stable story_id when
  assigned.

  Use when: a Story UUID came from GET /stories or GET /stories/{id}.

  Request parameters: id is required; Article filters include content_type,
  sources, domains, authors, categories, regions, entities, sentiments, tags,
  from, to, and full_content; limit is 1-100; cursor continues the same request.

  Do not use when: related reading is sufficient without Story membership; use
  GET /articles/{id}/similar for similarity results.

  Missing resource: HTTP 404 means the Story UUID was not found.

  Next step: preserve each returned Article UUID for GET /articles/{id}.
