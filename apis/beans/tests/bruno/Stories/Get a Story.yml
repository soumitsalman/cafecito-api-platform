docs: >-
  Answers: What related-coverage Story is identified by this UUID?

  Returns: One Story detail object inside data, including the stable UUID,
  coverage counts, labels, top Article previews, and links.articles.

  Use when: a Story UUID came from GET /stories or is already known.

  Request parameters: id is the required Story UUID path parameter.

  Response handoff: links.articles is service-relative; the public gateway call
  is GET /beans/stories/{id}/articles.

  Missing resource: HTTP 404 means the Story UUID was not found.

  Next step: call GET /stories/{id}/articles to retrieve the paginated member
  Articles.
