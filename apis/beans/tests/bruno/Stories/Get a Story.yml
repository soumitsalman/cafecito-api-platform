info:
  name: Get a Story by UUID
  type: http
  seq: 2
  tags:
    - Stories
http:
  method: GET
  url: "{{baseUrl}}/stories/:id"
  params:
    - name: id
      value: 0325c4ec-8881-5597-b8dd-a8a6eae19c49
      type: path
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/stories/:id"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: >-
          {
            "data": {
              "id": "0325c4ec-8881-5597-b8dd-a8a6eae19c49",
              "title": "Example Story",
              "first_published_at": "2026-08-20T10:00:00Z",
              "last_published_at": "2026-08-24T10:00:00Z",
              "article_count": 4,
              "source_count": 3,
              "categories": [
                "technology"
              ],
              "regions": [],
              "entities": [],
              "tags": [
                "technology"
              ],
              "top_articles": [],
              "links": {
                "articles": "/stories/0325c4ec-8881-5597-b8dd-a8a6eae19c49/articles"
              }
            }
          }
  - name: 400 Response
    description: Bad Request
