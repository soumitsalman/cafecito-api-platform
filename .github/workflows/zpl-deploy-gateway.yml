name: Gateway CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "apis/**"
  pull_request:
    paths-ignore:
      - "apis/**"
  workflow_dispatch:

# Backend-only pushes still skip this workflow (Zuplo GitHub integration
# should also ignore apis/**). Contract/docs checks are local or manual
# (`workflow_dispatch` on API Contract & Docs); they do not gate this job.

jobs:
  lint-and-test:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run lint
